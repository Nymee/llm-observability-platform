apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  namespace: llmobs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestion
  template:
    metadata:
      labels:
        app: ingestion
    spec:
      containers:
        - name: ingestion
          image: naynay1234/llmobs-ingestion:latest
          ports:
            - containerPort: 4001
          envFrom:
            - configMapRef:
                name: llmobs-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: llmobs-secret
                  key: DATABASE_URL
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-svc
  namespace: llmobs
spec:
  selector:
    app: ingestion
  ports:
    - port: 4001
      targetPort: 4001
