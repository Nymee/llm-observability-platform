apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: llmobs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: naynay1234/llmobs-frontend:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: llmobs-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: llmobs-secret
                  key: DATABASE_URL
            - name: GOOGLE_GENERATIVE_AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llmobs-secret
                  key: GOOGLE_GENERATIVE_AI_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llmobs-secret
                  key: OPENAI_API_KEY
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llmobs-secret
                  key: ANTHROPIC_API_KEY
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llmobs-secret
                  key: GROQ_API_KEY
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: llmobs
spec:
  type: NodePort         # exposes the service on a port on every node's IP
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000    # access the app at http://<server-ip>:30000
